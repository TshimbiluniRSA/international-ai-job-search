name: Scheduled job search

on:
  workflow_dispatch:
  schedule:
    # 07:30 South Africa time, Monday-Friday. This gives the 08:00 report time to consume the completed artifact.
    - cron: "30 5 * * 1-5"

concurrency:
  group: scheduled-job-search
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e '.[dev]'

      - name: Restore previous job history
        uses: actions/cache@v4
        with:
          path: data/raw/jobs.json
          key: job-history-${{ github.run_id }}
          restore-keys: |
            job-history-

      - name: Run discovery pipeline
        run: job-search run-all --sources config/sources.example.json

      - name: Upload search results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: international-job-search-${{ github.run_number }}
          path: |
            data/raw/jobs.json
            data/ranked/jobs.json
            data/ranked/shortlist.md
          if-no-files-found: warn
          retention-days: 30

      - name: Publish latest successful run pointer
        if: success()
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p automation
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg workflow "Scheduled job search" \
            --argjson run_id "$RUN_ID" \
            --argjson run_number "$RUN_NUMBER" \
            --arg artifact_name "international-job-search-$RUN_NUMBER" \
            --arg run_url "$RUN_URL" \
            --arg head_sha "$HEAD_SHA" \
            --arg conclusion "success" \
            --arg completed_at "$completed_at" \
            '{
              workflow: $workflow,
              run_id: $run_id,
              run_number: $run_number,
              artifact_name: $artifact_name,
              run_url: $run_url,
              head_sha: $head_sha,
              conclusion: $conclusion,
              completed_at: $completed_at
            }' > automation/latest-run.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/latest-run.json
          git commit -m "Update latest job-search run pointer [skip ci]"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
