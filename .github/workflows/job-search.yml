name: Scheduled job search

on:
  workflow_dispatch:
  schedule:
    # Three weekday attempts in South Africa Standard Time (UTC+2).
    # Later attempts skip automatically after the first successful search.
    - cron: "45 4 * * 1-5" # 06:45 SAST
    - cron: "15 5 * * 1-5" # 07:15 SAST
    - cron: "45 5 * * 1-5" # 07:45 SAST

concurrency:
  group: scheduled-job-search
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check whether today's search already completed
        id: daily_guard
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run requested; bypassing the daily guard."
            exit 0
          fi

          today_sast="$(TZ=Africa/Johannesburg date +'%Y-%m-%d')"
          git fetch origin main --quiet

          if git show origin/main:automation/latest-run.json > /tmp/latest-run.json 2>/dev/null; then
            conclusion="$(jq -r '.conclusion // empty' /tmp/latest-run.json)"
            completed_at="$(jq -r '.completed_at // empty' /tmp/latest-run.json)"
            completed_date_sast="$(
              TZ=Africa/Johannesburg date -d "$completed_at" +'%Y-%m-%d' 2>/dev/null || true
            )"

            if [ "$conclusion" = "success" ] && [ "$completed_date_sast" = "$today_sast" ]; then
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "A successful search already completed today ($today_sast); skipping this retry."
              exit 0
            fi
          fi

          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "No successful search is recorded for today ($today_sast); running the pipeline."

      - name: Search already completed
        if: steps.daily_guard.outputs.should_run == 'false'
        run: echo "No duplicate artifact or pointer update will be created."

      - uses: actions/setup-python@v5
        if: steps.daily_guard.outputs.should_run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.daily_guard.outputs.should_run == 'true'
        run: pip install -e '.[dev]'

      - name: Restore previous job history
        if: steps.daily_guard.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: data/raw/jobs.json
          key: job-history-${{ github.run_id }}
          restore-keys: |
            job-history-

      - name: Run discovery pipeline
        if: steps.daily_guard.outputs.should_run == 'true'
        run: job-search run-all --sources config/sources.example.json

      - name: Upload search results
        if: ${{ always() && steps.daily_guard.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: international-job-search-${{ github.run_number }}
          path: |
            data/raw/jobs.json
            data/ranked/jobs.json
            data/ranked/shortlist.md
          if-no-files-found: warn
          retention-days: 30

      - name: Publish latest successful run pointer
        if: ${{ success() && steps.daily_guard.outputs.should_run == 'true' }}
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          mkdir -p automation
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg workflow "Scheduled job search" \
            --argjson run_id "$RUN_ID" \
            --argjson run_number "$RUN_NUMBER" \
            --arg artifact_name "international-job-search-$RUN_NUMBER" \
            --arg run_url "$RUN_URL" \
            --arg head_sha "$HEAD_SHA" \
            --arg conclusion "success" \
            --arg completed_at "$completed_at" \
            '{
              workflow: $workflow,
              run_id: $run_id,
              run_number: $run_number,
              artifact_name: $artifact_name,
              run_url: $run_url,
              head_sha: $head_sha,
              conclusion: $conclusion,
              completed_at: $completed_at
            }' > automation/latest-run.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/latest-run.json
          git commit -m "Update latest job-search run pointer [skip ci]"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
